{% extends "base.html" %}
{% block title %}发布登记{% endblock %}
{% block body %}
<div class="card">
  <h1>发布登记</h1>
  <form method="post">
    <label>类型</label>
    <select name="type">
      <option value="lost">我丢了东西（寻物启事）</option>
      <option value="found">我捡到东西（失物招领）</option>
    </select>
    <label>物品名称 *</label>
    <input type="text" name="title" required placeholder="例如：黑色蓝牙耳机">
    <label>类别 *</label>
    <select name="category">
      <option>电子产品</option><option>证件卡片</option><option>钥匙</option>
      <option>日用品</option><option>书籍资料</option><option>其他</option>
    </select>
    <label>详细描述（越具体，智能匹配越准）</label>
    <textarea name="desc" required placeholder="颜色、特征、在里面放了什么……"></textarea>
    <label>地点 *</label>
    <input type="text" name="location" required placeholder="例如：图书馆三楼">
    <label>日期 *</label>
    <input type="date" name="date" required>
    <label>联系方式 *</label>
    <input type="text" name="contact" required placeholder="微信 / QQ / 手机号">
    <p><button class="btn green" type="submit">发布</button></p>
  </form>
</div>
{% endblock %}
