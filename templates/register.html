{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>用学号注册</h1>
  {% if error %}<p style="color:#cf222e">{{ error }}</p>{% endif %}
  <form method="post">
    <label>学号</label>
    <input type="text" name="uid" required placeholder="8 位以上数字">
    <label>姓名</label>
    <input type="text" name="name" required>
    <label>密码（至少 6 位）</label>
    <input type="password" name="pwd" required minlength="6">
    <p><button class="btn green" type="submit">注册并登录</button></p>
  </form>
  <p style="font-size:13px;color:#64748b">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
</div>
{% endblock %}
