{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>登录</h1>
  {% if error %}<p style="color:#cf222e">{{ error }}</p>{% endif %}
  {% if request.args.get('next') %}<p style="color:#b91c1c;font-size:13px">登录后才能继续该操作</p>{% endif %}
  <form method="post">
    <label>学号</label>
    <input type="text" name="uid" required placeholder="你的学号">
    <label>密码</label>
    <input type="password" name="pwd" required>
    <p><button class="btn green" type="submit">登录</button></p>
  </form>
  <p style="font-size:13px;color:#64748b">还没有账号？<a href="{{ url_for('register') }}">用学号注册</a></p>
</div>
{% endblock %}
